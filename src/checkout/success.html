<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepOutside | Order Success</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="critical" id="main-header"></header>

    <main class="divider">
        <div class="success-container" style="text-align: center; padding: 3rem 1rem;">
            <h2>Order Placed Successfully! 🎉</h2>
            <p>Thank you for your purchase. Your order has been received and is being processed.</p>
            <p>We’ve sent a confirmation email with your order details and tracking info.</p>

            <!-- Order Summary Details Box -->
            <div id="order-details"
                style="background: #f4f4f4; padding: 1.5rem; margin: 1.5rem auto; max-width: 450px; border-radius: 8px; text-align: left;">
                <p><strong>Order ID:</strong> <span id="order-id">Loading...</span></p>
                <p><strong>Total Paid:</strong> <span id="order-total">Loading...</span></p>
            </div>

            <div style="margin-top: 2rem;">
                <a href="../index.html" class="btn"
                    style="background-color: var(--primary-color); color: white; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px;">Back
                    to Home</a>
            </div>
        </div>
    </main>

    <footer id="main-footer"></footer>

    <script src="../js/success.js" type="module"></script>
</body>

</html>
